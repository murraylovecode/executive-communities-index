<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.browser_title | default: page.title }} | Executive Communities Index</title>
<meta name="description" content="{{ page.description | escape }}">
<meta name="author" content="Open Future Forum"><meta name="publisher" content="Open Future Forum">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.browser_title | default: page.title | escape }}"><meta property="og:description" content="{{ page.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:type" content="{% if page.layout == 'ranking' %}article{% else %}website{% endif %}">
<meta property="og:image" content="{{ page.social_image | default: site.data.site.social_image | absolute_url }}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Executive Communities Index: rankings, research and open data">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{ page.browser_title | default: page.title | escape }}"><meta name="twitter:description" content="{{ page.description | escape }}"><meta name="twitter:image" content="{{ page.social_image | default: site.data.site.social_image | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/aeo.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/directory.css' | relative_url }}">
{% include structured-data.html %}</head><body>
<a class="skip-link" href="#content">Skip to content</a>{% include header.html %}
<main id="content">{{ content }}</main>{% include footer.html %}<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script></body></html>
