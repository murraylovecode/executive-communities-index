name: Add a community
description: Propose a well-sourced executive community
title: "Community proposal: "
labels: [community-proposal]
body:
  - type: input
    id: name
    attributes: {label: Official name}
    validations: {required: true}
  - type: input
    id: url
    attributes: {label: Official website}
    validations: {required: true}
  - type: textarea
    id: details
    attributes: {label: Audience, geography, access, and formats}
    validations: {required: true}
  - type: textarea
    id: sources
    attributes: {label: Current sources}
    validations: {required: true}
